services:
  - type: web
    name: standoff-arena-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RESEND_API_KEY
        value: re_eYsdczXj_KhgQEHwWVdaTUnDDumDJwvtG
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: standoff-db
          property: connectionString

databases:
  - name: standoff-db
    databaseName: standoff_arena
    user: arena_admin
