services:
  - type: web
    name: standoff-arena-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push --accept-data-loss
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: standoff-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: standoff-redis
          property: connectionString

  - type: keyvalue
    name: standoff-redis
    plan: starter
    ipAllowList: []

databases:
  - name: standoff-db
    databaseName: standoff_arena
    user: arena_admin
